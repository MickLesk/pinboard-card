name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin

  build:
    name: Build and verify bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Snapshot committed bundle
        run: cp dist/pinboard-card.js "$RUNNER_TEMP/committed.js"

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify bundle
        run: npm run verify

      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm test

      - name: Verify committed bundle is current
        run: |
          if ! diff -u "$RUNNER_TEMP/committed.js" dist/pinboard-card.js > "$RUNNER_TEMP/bundle.diff"; then
            echo "::error file=dist/pinboard-card.js::Committed bundle is out of date. Run npm ci && npm run build and commit the result."
            head -n 80 "$RUNNER_TEMP/bundle.diff"
            exit 1
          fi
