name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, what did you see instead?
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Card configuration
      description: The YAML of the card (remove anything private)
      render: yaml
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Pinboard, Home Assistant and browser
      placeholder: "Pinboard 0.2.0, Home Assistant 2026.3.1, Safari on iOS 19"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Browser console output or screenshots
