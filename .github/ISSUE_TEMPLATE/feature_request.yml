name: Feature request
description: Suggest something the card should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do with the card?
      description: Describe the situation, not only the solution you have in mind
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How could it work?
      description: Options, YAML, sketches, anything that helps
