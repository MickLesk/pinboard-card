<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pinboard Card – demo</title>
  <style>
    :root {
      --primary-color: #03a9f4;
      --rgb-primary-color: 3, 169, 244;
      --primary-text-color: #212121;
      --rgb-primary-text-color: 33, 33, 33;
      --secondary-text-color: #727272;
      --text-primary-color: #fff;
      --card-background-color: #fff;
      --ha-card-background: #fff;
      --secondary-background-color: #e5e5e5;
      --divider-color: rgba(0, 0, 0, 0.12);
      --error-color: #db4437;
      --ha-card-border-radius: 12px;
      --mdc-icon-size: 24px;
    }
    body.dark {
      --primary-text-color: #e1e1e1;
      --rgb-primary-text-color: 225, 225, 225;
      --secondary-text-color: #9b9b9b;
      --card-background-color: #1c1c1c;
      --ha-card-background: #1c1c1c;
      --secondary-background-color: #282828;
      --divider-color: rgba(255, 255, 255, 0.12);
      background: #111;
      color: var(--primary-text-color);
    }
    body {
      margin: 0;
      padding: 24px;
      font-family: Roboto, "Segoe UI", system-ui, sans-serif;
      background: #fafafa;
      color: var(--primary-text-color);
    }
    h1 { font-size: 20px; font-weight: 500; margin: 0 0 4px; }
    p.lead { margin: 0 0 20px; color: var(--secondary-text-color); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; max-width: 1100px; }
    .cell h2 { font-size: 13px; font-weight: 500; margin: 0 0 8px; color: var(--secondary-text-color); text-transform: uppercase; letter-spacing: .06em; }
    .toolbar { margin-bottom: 20px; display: flex; gap: 12px; }
    button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--divider-color); background: var(--card-background-color); color: inherit; cursor: pointer; }
    ha-card { display: block; background: var(--ha-card-background); box-shadow: 0 2px 6px rgba(0,0,0,.12); }
    #editor { max-width: 520px; margin-top: 32px; padding: 16px; border-radius: 12px; background: var(--card-background-color); box-shadow: 0 2px 6px rgba(0,0,0,.12); }
    #editor h2 { font-size: 14px; margin: 0 0 12px; }
    ha-form { display: block; }
    ha-form pre { font-size: 12px; background: var(--secondary-background-color); padding: 8px; border-radius: 8px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Pinboard Card – demo</h1>
  <p class="lead">Local preview with minimal Home Assistant stubs. Tap a card to flip it.</p>
  <div class="toolbar">
    <button id="theme">Toggle dark theme</button>
    <button id="lang">Toggle language (en/de)</button>
    <button id="flipall">Flip all</button>
  </div>
  <div class="grid" id="grid"></div>

  <h2 style="font-size:13px;font-weight:500;margin:28px 0 8px;color:var(--secondary-text-color);text-transform:uppercase;letter-spacing:.06em">Sections view: fixed-height hosts (2 rows = 120px, 3 columns ≈ 245px)</h2>
  <div id="sections" style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start">
    <div class="host" style="height:120px;width:245px"></div>
    <div class="host" style="height:120px;width:245px"></div>
    <div class="host" style="height:232px;width:520px"></div>
    <div class="host" style="height:232px;width:400px"></div>
  </div>

  <div id="editor">
    <h2>Editor element (ha-form is stubbed as a JSON dump)</h2>
    <pinboard-card-editor></pinboard-card-editor>
  </div>

    customElements.define("ha-card", class extends HTMLElement {});
    customElements.define("ha-icon", class extends HTMLElement {
      static get observedAttributes() { return ["icon"]; }
      constructor() { super(); this.attachShadow({ mode: "open" }); }
      attributeChangedCallback() { this.render(); }
      connectedCallback() { this.render(); }
      render() {
        const d = ICONS[this.getAttribute("icon")] ?? "M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Z";
        this.shadowRoot.innerHTML = `<style>:host{display:inline-flex;width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px);align-items:center;justify-content:center}svg{width:100%;height:100%;fill:currentColor}</style><svg viewBox="0 0 24 24"><path d="${d}"/></svg>`;
      }
    });
    // Very small markdown: **bold**, *em*, line breaks, "- " lists.
    customElements.define("ha-markdown", class extends HTMLElement {
      set content(v) { this._c = v; this.render(); }
      get content() { return this._c; }
      render() {
        const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
        const html = esc(this._c ?? "")
          .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
          .replace(/\*(.+?)\*/g, "<em>$1</em>")
          .split(/\n{2,}/).map((p) => p.startsWith("- ")
            ? "<ul>" + p.split("\n").map((l) => `<li>${l.replace(/^- /, "")}</li>`).join("") + "</ul>"
            : `<p>${p.replace(/\n/g, "<br>")}</p>`).join("");
        this.innerHTML = html;
      }
    });
    customElements.define("ha-form", class extends HTMLElement {
      set schema(v) { this._s = v; this.render(); }
      set data(v) { this._d = v; this.render(); }
      set hass(v) {}
      set computeLabel(f) { this._l = f; this.render(); }
      set computeHelper(f) {}
      render() {
        if (!this._s || !this._d) return;
        const rows = [];
        const walk = (items) => items.forEach((i) => i.schema ? walk(i.schema) : rows.push(`${this._l ? this._l(i) : i.name}: ${JSON.stringify(this._d[i.name])}`));
        walk(this._s);
        this.innerHTML = `<pre>${rows.join("\n")}</pre>`;
      }
    });

    // ---- Fake hass --------------------------------------------------------------
    const states = {
      "sensor.boiler_temp": { entity_id: "sensor.boiler_temp", state: "54.5", attributes: { unit_of_measurement: "°C", friendly_name: "Boiler" } },
      "input_text.door_photo": { entity_id: "input_text.door_photo", state: "./workshop.jpg", attributes: { max: 255, friendly_name: "Door photo" } },
      "sensor.pressure": { entity_id: "sensor.pressure", state: "1.6", attributes: { unit_of_measurement: "bar", friendly_name: "Boiler pressure" } },
      "input_text.memo": { entity_id: "input_text.memo", state: "", attributes: { max: 255, friendly_name: "Memo" } },
      "person.mickey": { entity_id: "person.mickey", state: "home", attributes: { friendly_name: "Mickey", user_id: "u1" } },
      "todo.shopping": { entity_id: "todo.shopping", state: "2", attributes: { friendly_name: "Shopping list" }, last_changed: new Date(Date.now() - 600000).toISOString() },
      "binary_sensor.doorbell": { entity_id: "binary_sensor.doorbell", state: "off", attributes: { friendly_name: "Doorbell" } },
      "input_text.shopping": { entity_id: "input_text.shopping", state: "- [x] Milk\n- [ ] Bread\n- [ ] Coffee beans", attributes: { max: 255, friendly_name: "Shopping" }, last_changed: new Date(Date.now() - 3 * 3600000).toISOString() },
      "input_text.fridge_note": { entity_id: "input_text.fridge_note", state: "Milk is running low – buy 2 litres on Friday.", attributes: { max: 255, friendly_name: "Fridge note" }, last_changed: new Date(Date.now() - 7 * 60000).toISOString() },
    };
    let language = "en";
    const listeners = new Set();
    const templateSubs = new Set();
    const todoItems = [
      { uid: "a1", summary: "Milk", status: "completed", description: "The **lactose-free** one." },
      { uid: "b2", summary: "Bread", status: "needs_action" },
      { uid: "c3", summary: "Coffee beans", status: "needs_action" },
    ];
    const todoSubs = new Set();
    const notifyTodo = () => todoSubs.forEach((f) => f({ items: todoItems.map((i) => ({ ...i })) }));
    window.__todoItems = todoItems;
    const makeHass = () => ({
      states: { ...states },
      language,
      locale: { language },
      async callService(domain, service, data) {
        await new Promise((r) => setTimeout(r, 400));
        if (domain === "todo" && service === "update_item") {
          const item = todoItems.find((i) => i.uid === data.item || i.summary === data.item);
          if (item && data.status) item.status = data.status;
          notifyTodo();
        }
        if (domain === "todo" && service === "update_item" && (data.rename || data.description !== undefined)) {
          const item = todoItems.find((i) => i.uid === data.item);
          if (item && data.rename) item.summary = data.rename;
          if (item && data.description !== undefined) item.description = data.description;
          notifyTodo();
        }
        if (domain === "todo" && service === "remove_item") {
          for (const uid of data.item) { const i = todoItems.findIndex((x) => x.uid === uid); if (i >= 0) todoItems.splice(i, 1); }
          notifyTodo();
        }
        if (domain === "todo" && service === "add_item") {
          todoItems.push({ uid: "n" + Date.now(), summary: data.item, status: "needs_action" });
          notifyTodo();
        }
        if (service === "set_value") {
          states[data.entity_id] = { ...states[data.entity_id], state: data.value, last_changed: new Date().toISOString() };
          listeners.forEach((f) => f());
          templateSubs.forEach((f) => f());
        }
      },
      connection: {
        // Just enough of render_template for the demo: {{ states('x') }} and {{ now().strftime(...) }}.
        async subscribeMessage(callback, msg) {
          if (msg.type === "todo/item/subscribe") {
            todoSubs.add(callback);
            callback({ items: todoItems.map((i) => ({ ...i })) });
            return async () => todoSubs.delete(callback);
          }
          const render = () => msg.template
            .replace(/\{\{\s*states\('([^']+)'\)\s*\}\}/g, (_, id) => states[id]?.state ?? "unknown")
            .replace(/\{\{[^}]*\}\}/g, "…");
          callback({ result: render() });
          templateSubs.add(() => callback({ result: render() }));
          return async () => {};
        },
      },
      async fetchWithAuth(path, init) {
        await new Promise((r) => setTimeout(r, 200));
        window.__uploads = (window.__uploads ?? 0) + 1;
        if (path === "/api/image/upload") return new Response(JSON.stringify({ id: "demo123" }), { status: 200 });
        return new Response(JSON.stringify({ media_content_id: "media-source://media_source/local/pinboard/demo.jpg" }), { status: 200 });
      },
      async callWS(msg) {
        if (msg.type === "media_source/resolve_media") return { url: "./garden.jpg", mime_type: "image/svg+xml" };
        if (msg.type === "logbook/get_events") return [
          { when: Date.now() / 1000 - 7200, entity_id: msg.entity_ids[0], state: "Milk is running low – buy 2 litres on Friday.", context_user_id: "u1" },
          { when: Date.now() / 1000 - 86400 * 2, entity_id: msg.entity_ids[0], state: "Defrost on Sunday.", context_user_id: null },
          { when: Date.now() / 1000 - 86400 * 5, entity_id: msg.entity_ids[0], state: "Defrost on Sunday.", context_user_id: null },
        ];
        if (msg.type === "media_source/browse_media") return { children: [
          { media_content_id: msg.media_content_id + "/a.jpg", media_class: "image", media_content_type: "image/jpeg", title: "a.jpg" },
          { media_content_id: msg.media_content_id + "/notes.txt", media_class: "directory", media_content_type: "" },
          { media_content_id: msg.media_content_id + "/b.png", media_class: "image", media_content_type: "image/png", title: "b.png" },
        ] };
        throw new Error("unsupported");
      },
    });

    await import("../dist/pinboard-card.js");

    // A one-second silent WAV so the audio player has something to play.
    const silentWav = (() => {
      const rate = 8000, samples = rate;
      const buf = new ArrayBuffer(44 + samples * 2), v = new DataView(buf);
      const str = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
      str(0, "RIFF"); v.setUint32(4, 36 + samples * 2, true); str(8, "WAVE"); str(12, "fmt ");
      v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true);
      v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); str(36, "data"); v.setUint32(40, samples * 2, true);
      return "data:audio/wav;base64," + btoa(String.fromCharCode(...new Uint8Array(buf)));
    })();
    const configs = [
      { label: "3D flip (default)", config: { type: "custom:pinboard-card", title: "Kitchen", image: "./kitchen.jpg", note: "**Filter replaced** on 12 Oct.\n\nNext change due in 6 months.\n\n- Model: XY-200\n- Ordered from the usual shop" } },
      { label: "Vertical flip, editable note (input_text)", config: { type: "custom:pinboard-card", title: "Fridge", image: "./garden.jpg", direction: "vertical", note_entity: "input_text.fridge_note" } },
      { label: "Crossfade, 4:3, contain", config: { type: "custom:pinboard-card", title: "Garden", image: "./workshop.jpg", transition: "fade", aspect_ratio: "4:3", image_fit: "contain", note: "Water the tomatoes every second day.\nSeedlings go out after the last frost." } },
      { label: "Slide, no title, starts on note", config: { type: "custom:pinboard-card", image: "./kitchen.jpg", transition: "slide", default_side: "note", note: "A card without a title.\n\nIt starts on the note side and slides to the picture." } },
      { label: "Cube, media-source picture, auto flip 4 s", config: { type: "custom:pinboard-card", title: "Cube", image: "media-source://media_source/local/demo.jpg", transition: "cube", auto_flip: 4, note: "Media-source ids are resolved through the websocket API.\n\nThis one auto-flips every 4 seconds." } },
      { label: "Empty states", config: { type: "custom:pinboard-card", title: "Nothing yet" } },
      { label: "Broken picture + missing entity", config: { type: "custom:pinboard-card", title: "Broken", image: "./does-not-exist.jpg", note_entity: "input_text.missing" } },
      { label: "Natural size, hover flip", config: { type: "custom:pinboard-card", title: "Natural", image: "./workshop.jpg", aspect_ratio: "auto", hover_flip: true, note: "Hover me on a desktop." } },
      { label: "Gallery: three pictures, each with its own note", config: { type: "custom:pinboard-card", title: "Garage", images: [
        { image: "./kitchen.jpg", title: "Bike", note: "Chain oiled in March." },
        { image: "./garden.jpg", note: "Tyres: 2.5 bar front, 2.8 bar rear." },
        { image: "./workshop.jpg", title: "Tools", note_entity: "input_text.fridge_note" },
      ] } },
      { label: "Free order: picture, note, note, picture, note (5 slides)", config: { type: "custom:pinboard-card", title: "Trip", slides: [
        { image: "./workshop.jpg", title: "Arrival" },
        { note: "Day 1: **arrived** late, hotel is fine." },
        { note: "Day 2: hiking. Bring water." },
        { image: "./garden.jpg", title: "Lake" },
        { note_entity: "input_text.fridge_note", title: "Shopping" },
      ] } },
      { label: "Tiles: four pictures side by side, each flips on its own", config: { type: "custom:pinboard-card", title: "Garden", layout: "grid", columns: 2, images: [
        { image: "./kitchen.jpg", title: "Tomatoes", note: "Water every second day." },
        { image: "./garden.jpg", title: "Herbs", note: "Cut back the mint." },
        { image: "./workshop.jpg", title: "Lawn", note_entity: "input_text.fridge_note" },
        { image: "./kitchen.jpg", title: "Compost", note: "Turn it on Sunday." },
      ] } },
      { label: "Checklist from an input_text (writes back), sticky look", config: { type: "custom:pinboard-card", title: "Shopping", image: "./garden.jpg", note_entity: "input_text.shopping", note_style: "sticky", default_side: "note" } },
      { label: "To-do list page (todo.shopping), add items on the card", config: { type: "custom:pinboard-card", title: "", image: "./kitchen.jpg", todo_entity: "todo.shopping", note: "Before the weekend:", default_side: "note" } },
      { label: "Checklist in the config (read-only boxes), template, colour, expiry", config: { type: "custom:pinboard-card", title: "Boiler", slides: [
        { image: "./kitchen.jpg" },
        { note: "Boiler is at **{{ states('sensor.boiler_temp') }} °C**.\n\n- [ ] Check pressure\n- [x] Bleed radiators\n- [ ] Order filter", color: "blue" },
        { note: "Parcel at the neighbour's until Friday.", color: "yellow", expires: "2020-01-01", title: "Old note" },
        { note: "Valid for a while.", color: "green", expires: "2099-12-31" },
        { note: "Dark page with light text.", color: "#2b3a55", text_color: "light" },
      ] } },
      { label: "Markers on the picture, Ken Burns", config: { type: "custom:pinboard-card", title: "Boiler room", image: "./kitchen.jpg", ken_burns: true, markers: [
        { x: 30, y: 45, label: "Stopcock", icon: "mdi:water-off" },
        { x: 72, y: 30, label: "Pressure gauge", entity: "sensor.pressure" },
        { x: 85, y: 85, entity: "sensor.boiler_temp" },
      ], note: "Turn the stopcock (1) before opening the filter." } },
      { label: "Picture from an input_text with a camera button", config: { type: "custom:pinboard-card", title: "Front door", image_entity: "input_text.door_photo", note: "Latest photo of the door. Tap the camera to replace it." } },
      { label: "Audio memo: picture, then a recording", config: { type: "custom:pinboard-card", title: "Voice memo", image: "./garden.jpg", audio: silentWav, note: "Also a note after the memo." } },
      { label: "Audio from an input_text with a record button", config: { type: "custom:pinboard-card", title: "Memo box", audio_entity: "input_text.memo", color: "purple", note_style: "sticky" } },
      { label: "Conditional page: the second picture only while binary_sensor.doorbell is on; per-page hold action", config: { type: "custom:pinboard-card", title: "Door", slides: [
        { image: "./workshop.jpg", title: "Always" },
        { image: "./kitchen.jpg", title: "Someone rang", visible: { entity: "binary_sensor.doorbell", state: "on" }, hold_action: { action: "url", url_path: "https://example.com/door" } },
        { note: "Always shown too." },
      ] } },
      { label: "Hold → more-info, double tap → URL", config: { type: "custom:pinboard-card", title: "Actions", image: "./garden.jpg", note_entity: "input_text.fridge_note", hold_action: { action: "more-info" }, double_tap_action: { action: "url", url_path: "https://example.com" } } },
    ];
    window.__events = [];
    document.addEventListener("hass-more-info", (ev) => window.__events.push({ type: "hass-more-info", detail: ev.detail }));
    window.open = (url) => { window.__events.push({ type: "open", url }); return null; };

    const grid = document.getElementById("grid");
    const cards = [];
    for (const { label, config } of configs) {
      const cell = document.createElement("div");
      cell.className = "cell";
      const h = document.createElement("h2");
      h.textContent = label;
      const card = document.createElement("pinboard-card");
      card.setConfig(config);
      card.hass = makeHass();
      cell.append(h, card);
      grid.append(cell);
      cards.push(card);
    }
    const sectionConfigs = [
      { type: "custom:pinboard-card", title: "Greenhouse", image: "./garden.jpg", default_side: "note", note: "**Water in the morning**, the afternoon sun burns the leaves.\n\nTap the note to see the picture behind it.\n\n- Tomatoes: every second day\n- Herbs: twice a week" },
      { type: "custom:pinboard-card", title: "Kitchen", slides: [{ image: "./kitchen.jpg" }, { note: "Note between" }, { image: "./workshop.jpg" }] },
      { type: "custom:pinboard-card", title: "Long note", image: "./workshop.jpg", default_side: "note", note_entity: "input_text.fridge_note", note: "" },
      { type: "custom:pinboard-card", layout: "grid", images: [{ image: "./kitchen.jpg", title: "A", note: "Note A" }, { image: "./garden.jpg", title: "B", note: "Note B" }] },
    ];
    document.querySelectorAll("#sections .host").forEach((host, i) => {
      const card = document.createElement("pinboard-card");
      card.setConfig(sectionConfigs[i]);
      card.hass = makeHass();
      host.append(card);
      cards.push(card);
    });
    const editor = document.querySelector("pinboard-card-editor");
    editor.setConfig(configs[1].config);
    editor.hass = makeHass();
    editor.addEventListener("config-changed", (ev) => console.log("config-changed", ev.detail.config));

    const push = () => { const h = makeHass(); cards.forEach((c) => (c.hass = h)); editor.hass = h; };
    listeners.add(push);
    document.getElementById("theme").addEventListener("click", () => document.body.classList.toggle("dark"));
    document.getElementById("lang").addEventListener("click", () => { language = language === "en" ? "de" : "en"; push(); });
    document.getElementById("flipall").addEventListener("click", () => cards.forEach((c) => c.flip()));
    window.__setState = (id, state) => { states[id] = { ...states[id], state, last_changed: new Date().toISOString() }; push(); };
    window.__cards = cards;
    window.__hassStates = () => states;
  </script>
</body>
</html>
